name: Build & Push — Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # API source & config
      - "devintel-api/app/**"
      - "devintel-api/requirements.txt"
      - "devintel-api/alembic/**"
      - "devintel-api/Dockerfile"
      # Next.js source & config
      - "devintel-next/app/**"
      - "devintel-next/components/**"
      - "devintel-next/lib/**"
      - "devintel-next/hooks/**"
      - "devintel-next/context/**"
      - "devintel-next/types/**"
      - "devintel-next/package.json"
      - "devintel-next/pnpm-lock.yaml"
      - "devintel-next/Dockerfile"
      # Compose files
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - "docker-compose.prod.yml"

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Debug username
        run: echo "USERNAME=${{ vars.DOCKERHUB_USERNAME }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Short SHA used as a unique, traceable image tag per commit.
      # 'latest' is also pushed so the server can pull without tracking versions.
      - name: Resolve image version
        id: version
        run: echo "VERSION=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Ensure env files exist for compose
        run: |
          touch devintel-api/.env
          touch devintel-next/.env

      # The prod file supplies the build: contexts (./devintel-api, ./devintel-next).
      # Locally it is auto-merged; in CI we must be explicit.
      # We do NOT include docker-compose.prod.yml here because it resets build: to null —
      # that file is only for the runtime stack on the server.
      - name: Build images
        env:
          DEVINTEL_API_VERSION: ${{ steps.version.outputs.VERSION }}
          DEVINTEL_NEXT_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            build

      - name: Push versioned images
        env:
          DEVINTEL_API_VERSION: ${{ steps.version.outputs.VERSION }}
          DEVINTEL_NEXT_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            push devintel-api devintel-next

      # Keep 'latest' in sync so your server's docker-compose.prod.yml
      # (which defaults to :latest) always has a fresh image to pull.
      - name: Retag and push :latest
        run: |
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/devintel-api:${{ steps.version.outputs.VERSION }} \
                     ${{ vars.DOCKERHUB_USERNAME }}/devintel-api:latest
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/devintel-next:${{ steps.version.outputs.VERSION }} \
                     ${{ vars.DOCKERHUB_USERNAME }}/devintel-next:latest

          docker push ${{ vars.DOCKERHUB_USERNAME }}/devintel-api:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/devintel-next:latest

      - name: Summary
        run: |
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| devintel-api  | \`${{ steps.version.outputs.VERSION }}\`, \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| devintel-next | \`${{ steps.version.outputs.VERSION }}\`, \`latest\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy env files to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            BASE_ENV_FILE="${{ secrets.SERVER_BASE_ENV_FILE }}"
            API_ENV_FILE="${{ secrets.SERVER_API_ENV_FILE }}"
            NEXT_ENV_FILE="${{ secrets.SERVER_NEXT_ENV_FILE }}"

            if [ -z "$BASE_ENV_FILE" ] || [ -z "$API_ENV_FILE" ] || [ -z "$NEXT_ENV_FILE" ]; then
              echo "One or more env source path secrets are empty. Check SERVER_BASE_ENV_FILE, SERVER_API_ENV_FILE, SERVER_NEXT_ENV_FILE."
              exit 1
            fi

            mkdir -p ${{ secrets.SERVER_APP_DIR }}/devintel-api
            mkdir -p ${{ secrets.SERVER_APP_DIR }}/devintel-next

            [ -f "$BASE_ENV_FILE" ] || { echo "Missing file: $BASE_ENV_FILE"; exit 1; }
            [ -f "$API_ENV_FILE" ] || { echo "Missing file: $API_ENV_FILE"; exit 1; }
            [ -f "$NEXT_ENV_FILE" ] || { echo "Missing file: $NEXT_ENV_FILE"; exit 1; }

            cp "$BASE_ENV_FILE" "${{ secrets.SERVER_APP_DIR }}/.env"
            cp "$API_ENV_FILE" "${{ secrets.SERVER_APP_DIR }}/devintel-api/.env"
            cp "$NEXT_ENV_FILE" "${{ secrets.SERVER_APP_DIR }}/devintel-next/.env"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml
          target: ${{ secrets.SERVER_APP_DIR }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull devintel-api devintel-next
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d devintel-api devintel-next
