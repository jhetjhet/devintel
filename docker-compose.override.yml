services:
  postgres:
    restart: unless-stopped

  devintel-api:
    build:
      context: ./devintel-api
    restart: unless-stopped
    volumes:
      - ./devintel-api:/app
    environment:
      ENVIRONMENT: development
    command: ["sh", "-c", "exec uvicorn app.main:socket_app --reload --host 0.0.0.0 --port 8000"]

  devintel-migrate:
    command: alembic upgrade head

  devintel-next:
    build:
      context: ./devintel-next
      target: dev
    restart: unless-stopped
    volumes:
      - ./devintel-next:/app
      - /app/node_modules
      - /app/.next
    environment:
      ENVIRONMENT: development
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["pnpm", "dev"]
