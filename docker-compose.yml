services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devintel}
      POSTGRES_DB: ${POSTGRES_DB:-devintel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devintel} -d ${POSTGRES_DB:-devintel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net
    expose:
      - 5432

  devintel-api:
    image: snits/devintel-api:${DEVINTEL_API_VERSION:-latest}
    build:
      context: ./devintel-api
    env_file:
      - ./devintel-api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devintel}:${POSTGRES_PASSWORD:-devintel}@postgres:5432/${POSTGRES_DB:-devintel}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devintel_net
      - internal_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DEVINTEL_API_PORT:-8000}:8000"

  devintel-migrate:
    image: snits/devintel-api:${DEVINTEL_API_VERSION:-latest}
    env_file:
      - ./devintel-api/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devintel}:${POSTGRES_PASSWORD:-devintel}@postgres:5432/${POSTGRES_DB:-devintel}
    command: alembic upgrade head
    restart: "no"
    networks:
      - internal_net

  devintel-next:
    image: snits/devintel-next:${DEVINTEL_NEXT_VERSION:-latest}
    build:
      context: ./devintel-next
    env_file:
      - ./devintel-next/.env
    depends_on:
      devintel-api:
        condition: service_started
    networks:
      - internal_net
      - devintel_net
    ports:
      - "${DEVINTEL_NEXT_PORT:-3000}:3000"

networks:
  devintel_net:
    external: true
  internal_net:
    driver: bridge

volumes:
  postgres_data:
